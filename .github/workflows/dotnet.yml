name: Publich
'on':
  workflow_dispatch: null
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: get current date
        id: date
        run: echo "::set-output name=today::$(date +'%Y-%m-%d')"
      - name: create release
        id: create_release
        uses: GongT/actions-recreate-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        with:
          tag_name: v2.0.20
          release_name: v2.0.20.${{ steps.date.outputs.today }}
          draft: false
          prerelease: false
          body: "1. 2026-08-21 16:30:00\r\n2. 使用WSASendTo和SendMmsg批量发送UDP数据包，提升发送效率\r\n3. 装路径泄露和CORS宽松修复"
      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: setup dotnet
        uses: actions/setup-dotnet@v4
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        with:
          dotnet-version: 8.0.x
      - name: install dotnet maui
        run: dotnet workload install maui
      - name: publish projects
        run: ./shells/publish.bat "C:\\Android\\android-sdk"
      - name: upload-win-x86-oss
        id: upload-win-x86-oss
        uses: lslzl3000/oss-action@v1.0.1
        with:
          region: oss-cn-shenzhen
          key-id: ${{ secrets.ALIYUN_OSS_ID }}
          key-secret: ${{ secrets.ALIYUN_OSS_SECRET }}
          bucket: ide-qbcode
          assets: >-
            ./public/publish-zip/linker-win-x86.zip:/downloads/linker/v2.0.20/linker-win-x86.zip
          timeout: '720000'
      - name: upload-win-x86
        id: upload-win-x86
        uses: actions/upload-release-asset@master
        env:
          GITHUB_TOKEN: ${{ secrets.ACTIONS_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./public/publish-zip/linker-win-x86.zip
          asset_name: linker-win-x86.zip
          asset_content_type: application/zip
      - name: upload-win-x64-oss
        id: upload-win-x64-oss
        uses: lslzl3000/oss-action@v1.0.1
        with:
